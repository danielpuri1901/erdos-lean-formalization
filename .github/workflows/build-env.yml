name: build-env
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example env-v1)
        required: true
permissions:
  contents: write
jobs:
  build-env:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Free disk space (the runner ran out while packaging)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install the toolchain into /opt/lean (no elan), the same path the cloud setup script uses
        run: |
          sudo mkdir -p /opt/lean
          curl -sSfL -o /tmp/lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          sudo tar --use-compress-program=unzstd -xf /tmp/lean.tar.zst -C /opt/lean --strip-components=1
          echo "/opt/lean/bin" >> "$GITHUB_PATH"
          /opt/lean/bin/lean --version
      - name: Fetch dependencies, cache, and build
        run: |
          lake update --keep-toolchain 2>/dev/null || lake update
          git diff --exit-code lake-manifest.json
          lake exe cache get
          lake build Challenge Solution
          rm -rf ~/.cache/mathlib
      - name: Package the project .lake (the toolchain comes from the public Lean release)
        run: |
          set -o pipefail
          du -sh .lake .lake/packages/* | tee -a "$GITHUB_STEP_SUMMARY"
          # Stream straight into parts, so the archive is never on disk twice.
          tar -cf - .lake | zstd -T0 -3 | split -b 1900m - env.tar.zst.part-
          # One line per part, so the setup script learns the part names from this file alone.
          sha256sum env.tar.zst.part-* > env.sha256
          ls -la env.tar.zst.part-* env.sha256 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" env.tar.zst.part-* env.sha256 --title "${{ inputs.tag }}" --notes "Built .lake for the formal-conjectures pin (Lean 4.33.1 at /opt/lean)" --latest=false
