name: setup-smoke
# Runs the cloud setup path on a fresh runner: setup script as root with no GitHub token
# (like the cloud VM), then the session hook, then a timed build. Pass criteria from plan Task 5 step 6.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove zstd, which the cloud image lacks (smoke session 2026-10-03)
        run: |
          sudo apt-get purge -y -qq zstd
          sudo rm -f /usr/local/bin/*zstd*
          ! command -v unzstd && ! sudo bash -c 'command -v unzstd'
      - name: Run the setup script as root
        run: |
          sudo env -u GITHUB_TOKEN bash scripts/setup-cloud.sh
          cat /tmp/cloud-setup.log
      - name: Setup restored Lean and the packages in under 300 seconds
        run: |
          s=$(sed -n 's/^setup_seconds=//p' /tmp/cloud-setup.log)
          echo "setup_seconds=${s:-missing}" | tee -a "$GITHUB_STEP_SUMMARY"
          ! grep -q "setup failed" /tmp/cloud-setup.log
          /opt/lean/bin/lean --version
          [ -d /opt/erdos-env/.lake/packages/mathlib/.lake/build ]
          [ -n "$s" ] && [ "$s" -lt 300 ]
      - name: Git can read every package as plain root (cloud session 2026-10-03)
        # sudo sets SUDO_UID, which makes git trust the runner's files; a cloud session is root without it.
        run: |
          # Also hide the runner's own git config, which may mark every directory safe.
          mkdir -p "$RUNNER_TEMP/emptyhome"
          for p in /opt/erdos-env/.lake/packages/*; do
            sudo env -i HOME="$RUNNER_TEMP/emptyhome" PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 git -C "$p" remote get-url origin
          done
      - name: Session hook moves .lake into the checkout and builds Challenge, as root like the cloud session
        timeout-minutes: 10
        run: |
          sudo env -u SUDO_UID -u SUDO_GID -u SUDO_USER CLAUDE_CODE_REMOTE=true CLAUDE_PROJECT_DIR="$PWD" bash scripts/session-start.sh | tee hook.log
          ! grep -q "URL has changed" /tmp/lake-check.log
          grep -q "lake build Challenge: exit 0" hook.log
      - name: Full build as root in under 60 seconds (dependencies are not rebuilt)
        timeout-minutes: 10
        run: |
          start=$(date +%s); sudo env -u SUDO_UID -u SUDO_GID -u SUDO_USER PATH=/opt/lean/bin:$PATH lake build Challenge Solution; s=$(( $(date +%s) - start ))
          echo "build_seconds=$s" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$s" -lt 60 ]
