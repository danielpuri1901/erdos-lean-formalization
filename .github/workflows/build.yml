name: build
# Manual only: the checker repository is the CI that decides verdicts, and runs on every
# push of a busy agent would spend Actions minutes on red work-in-progress commits.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies and Mathlib cache
        run: |
          lake update --keep-toolchain 2>/dev/null || lake update
          git diff --exit-code lake-manifest.json
          lake exe cache get
      - name: Build
        run: |
          start=$(date +%s)
          lake build Challenge Solution
          echo "build_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Axioms of the solution
        run: |
          thm=$(sed -n 's/^theorem \([^ :]*\).*/\1/p' Challenge.lean | head -1)
          printf 'import Solution\n/-! Axiom report for the solution. -/\n#print axioms %s\n' "$thm" > /tmp/Axioms.lean
          lake env lean /tmp/Axioms.lean | tee axioms.txt
          # The statement itself uses classical definitions, so only a subset of the permitted axioms is accepted.
          grep -qE "does not depend on any axioms|depends on axioms: \[((propext|Classical\.choice|Quot\.sound)(, )?)*\]$" axioms.txt
      - name: Time the Green 72 N=60 kernel check
        # Manual runs only, so ordinary pushes do not pay for the experiment.
        if: github.event_name == 'workflow_dispatch'
        run: |
          start=$(date +%s); lake build Timing; echo "timing_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
